<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ENVIN Studio 2</title>
<style>
:root{
  /* Plán: jeden sloupec pro telefon. Nahoře pevná hlavička, dole dvě záložky.
     Poznámky jako blok řádků, videa jako karty, při natáčení velká zaškrtávátka. */
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f4f6fd; --line:#e2e6f1; --line-2:#cdd3e6; --seg-on:#ffffff;
  --ink:#0b1030; --muted:#59638a; --faint:#9aa2bd;
  --blue:#2f5bff; --blue-ink:#1a3bd4; --blue-soft:#e8edff;
  --gold:#ffc93c; --gold-ink:#7a4d05; --gold-soft:#fff4d4;
  --green:#17a34a; --green-ink:#0d6a30; --green-soft:#dcf6e5;
  --red:#d92d34; --red-soft:#ffe4e4;
  --c-envin:#2f5bff; --c-neli:#ff3d8b; --c-both:#8a3fd8;
  --display:"Inter Display","Arial Black","Helvetica Neue",sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:12px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --shadow:0 1px 2px rgba(11,16,48,.05),0 6px 18px rgba(11,16,48,.06);
  --shadow-lg:0 18px 50px rgba(11,16,48,.24); --scrim:rgba(9,12,36,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080b22; --surface:#11163a; --surface-2:#182050; --line:#232a5c; --line-2:#36407f; --seg-on:#3d49a6;
    --ink:#eef1ff; --muted:#a6aed2; --faint:#6d77a3;
    --blue:#5b7cff; --blue-ink:#a9b9ff; --blue-soft:#1a2366;
    --gold:#ffc93c; --gold-ink:#ffd978; --gold-soft:#3a2c0a;
    --green:#3fd27a; --green-ink:#86e6ae; --green-soft:#0f3324;
    --red:#ff6b70; --red-soft:#3d1517;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.55); --scrim:rgba(2,3,12,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080b22; --surface:#11163a; --surface-2:#182050; --line:#232a5c; --line-2:#36407f; --seg-on:#3d49a6;
  --ink:#eef1ff; --muted:#a6aed2; --faint:#6d77a3;
  --blue:#5b7cff; --blue-ink:#a9b9ff; --blue-soft:#1a2366;
  --gold:#ffc93c; --gold-ink:#ffd978; --gold-soft:#3a2c0a;
  --green:#3fd27a; --green-ink:#86e6ae; --green-soft:#0f3324;
  --red:#ff6b70; --red-soft:#3d1517;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55); --scrim:rgba(2,3,12,.65);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:21px} h3{font-size:17px}
p{margin:0}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
textarea{resize:none;display:block}
textarea.auto{overflow:hidden}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
textarea.auto:focus-visible,.stitle:focus-visible,.vtitle:focus-visible,.pl-title-in:focus-visible{outline:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- kostra ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#top{flex:none;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gr) 10px var(--gl);background:var(--bg)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px var(--gr) calc(40px + env(safe-area-inset-bottom,0px)) var(--gl)}
#view:focus{outline:none}
#tabbar{flex:none;display:flex;justify-content:center;gap:10px;padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);border-top:1.5px solid var(--line)}
.tab{flex:1;max-width:240px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tab svg.i{width:25px;height:25px}
.tab.on{color:var(--blue)}
.page{display:flex;flex-direction:column;gap:12px}

.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.01em;min-height:30px}
.brand b{color:var(--blue);font-weight:900}
.brand svg{width:30px;height:22px;flex:none}

/* ---------- přepínač ---------- */
.seg{display:flex;gap:2px;padding:3px;background:var(--line);border-radius:15px}
.seg button{flex:1;min-width:0;min-height:42px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(11,16,48,.14)}
.seg .n{font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- tlačítka ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;width:100%;font-size:17px;border-radius:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--blue-ink)}
.btn.dashed{background:none;border-style:dashed;color:var(--muted);width:100%;min-height:52px}
.btn.danger{color:var(--red)}
.btn.primary.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.vcard:active,.menu-item:active{transform:scale(.985)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--muted)}
.icon-btn.solid{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--blue-ink)}
.linkbtn svg.i{width:18px;height:18px}

/* ---------- karty, texty ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.hero{display:flex;flex-direction:column;gap:12px;padding:20px 18px}
.hero p{color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-weight:900;font-size:18px;margin-bottom:4px}
.loading{padding:26px 10px;text-align:center;color:var(--muted);font-weight:700}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);font-size:14px;font-weight:500}
.banner span{flex:1;min-width:0}
.banner button{flex:none;min-height:36px;padding:0 12px;border-radius:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13.5px}
.banner.info{background:var(--blue-soft);color:var(--blue-ink)}
.banners{display:flex;flex-direction:column;gap:8px}
.banners:empty{display:none}

/* ---------- poznámky ---------- */
.addbox{display:flex;align-items:flex-end;gap:8px;padding:5px 5px 5px 14px;background:var(--surface);border:2px solid var(--line-2);border-radius:17px}
.addbox:focus-within{border-color:var(--blue)}
.add-input{overflow-y:auto;flex:1;min-width:0;border:0;background:none;outline:none;padding:9px 0;font-size:16.5px;line-height:1.4;max-height:132px}
.add-btn{flex:none;width:42px;height:42px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center}
.rows{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rows:empty{display:none}
.row{display:flex;align-items:flex-start;padding:3px 2px 3px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:focus-within{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-text{width:100%;border:0;background:none;outline:none;padding:11px 4px;font-size:16.5px;line-height:1.4}
.star{flex:none;width:42px;height:46px;display:grid;place-items:center;color:var(--line-2)}
.star.on{color:var(--gold)}
.star.on svg.i{fill:currentColor}
.row .icon-btn{width:40px;height:46px;color:var(--faint)}
.count{display:block;padding:0 4px 9px;font-size:12.5px;font-weight:500;color:var(--gold-ink)}
.count:empty{display:none}

/* ---------- videa ---------- */
.vcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.vt{font-family:var(--display);font-weight:900;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.vmeta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill svg.i{width:15px;height:15px}
.pill.ok{background:var(--green-soft);color:var(--green-ink)}
.pill.date{background:var(--gold-soft);color:var(--gold-ink)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;min-width:0;background:var(--green);border-radius:99px;transition:width .25s}
details.done-box{display:flex;flex-direction:column;gap:12px}
details.done-box summary{min-height:44px;display:flex;align-items:center;padding:0 6px;font-weight:700;color:var(--muted);cursor:pointer;list-style:none}
details.done-box summary::-webkit-details-marker{display:none}
details.done-box summary::after{content:"▾";margin-left:8px}
details.done-box[open] summary::after{content:"▴"}
details.done-box .vcard{margin-bottom:12px;opacity:.8}

/* ---------- video: hlavička ---------- */
.vhead{display:flex;align-items:center;gap:6px}
.vtitle{flex:1;min-width:0;border:0;background:none;padding:6px 2px;font-family:var(--display);font-weight:900;font-size:20px;border-radius:10px;text-overflow:ellipsis}
.vtitle:focus{background:var(--surface);box-shadow:0 0 0 2px var(--blue)}

/* ---------- scénář ---------- */
.toolbar{display:flex;align-items:center;gap:8px}
.toolbar .btn{flex:1;padding:0 10px}
.stats{font-size:13.5px;font-weight:500;color:var(--muted);padding:0 4px}
.stats:empty{display:none}
.scenes{display:flex;flex-direction:column;gap:12px}
.scene{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 6px 6px}
.shead{display:flex;align-items:center;gap:8px;padding:0 0 2px 6px}
.snum{flex:none;min-width:28px;height:28px;padding:0 7px;border-radius:9px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:900;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stitle{flex:1;min-width:0;border:0;background:none;padding:9px 0;font-family:var(--display);font-weight:900;font-size:18px}
.line{display:flex;align-items:flex-start;gap:8px;padding:1px 4px 1px 6px;border-radius:12px}
.line:focus-within{background:var(--surface-2)}
.who{flex:none;width:58px;min-height:30px;margin-top:6px;padding:0 2px;border-radius:9px;font-size:12.5px;font-weight:700;color:#fff;background:var(--wc,#59638a);background:color-mix(in srgb,var(--wc,#59638a) 86%,#000);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-w="envin"]{--wc:var(--c-envin)} [data-w="neli"]{--wc:var(--c-neli)} [data-w="both"]{--wc:var(--c-both)}
.who[data-w="do"]{background:var(--gold-soft);color:var(--gold-ink)}
.who[data-w="none"]{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.ltext{flex:1;min-width:0;border:0;background:none;outline:none;padding:9px 0;font-size:16.5px;line-height:1.4}
.line.do .ltext{font-style:italic;color:var(--muted)}
.addline{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin:2px 0 0 4px;padding:0 10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.addline svg.i{width:17px;height:17px}

/* ---------- plán natáčení ---------- */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog-row b{font-family:var(--display);font-weight:900;font-size:19px}
.datebox{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.datebox input{min-height:38px;padding:0 10px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:500;color:var(--ink)}
.tip{font-size:14.5px;color:var(--muted)}
.tip b{color:var(--ink)}
.alldone{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--green-soft);color:var(--green-ink);font-weight:700}
details.pack{padding:4px 12px 4px 14px}
details.pack summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none}
details.pack summary::-webkit-details-marker{display:none}
details.pack summary .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
details.pack summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.pack[open] summary::after{content:"▴"}
.pack-list{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.pk{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 13px 0 10px;border-radius:12px;background:var(--surface-2);font-size:14.5px;font-weight:500;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2);text-align:left}
.pkbox{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent}
.pkbox svg.i{width:13px;height:13px;stroke-width:4}
.pk.on{background:var(--green-soft);color:var(--green-ink);box-shadow:none}
.pk.on .pkbox{background:var(--green);border-color:var(--green);color:#fff}
.place{display:flex;align-items:center;gap:6px;margin:8px 4px -4px;font-family:var(--display);font-weight:900;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-ink)}
.place svg.i{width:18px;height:18px}
.pscene{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 8px 6px 12px;display:flex;flex-direction:column}
.pl-head{display:flex;align-items:flex-start;gap:8px}
.pl-head .t{flex:1;min-width:0;padding-top:6px}
.pl-n{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pl-title{font-size:19px;overflow-wrap:anywhere}
.pl-title-in{width:100%;border:0;background:none;padding:4px 0;font-family:var(--display);font-weight:900;font-size:19px}
.props{font-size:14.5px;color:var(--muted);padding:2px 0 4px}
.props b{color:var(--ink)}
.shot{display:flex;align-items:flex-start;margin-left:-8px}
.check{flex:none;width:46px;height:46px;display:grid;place-items:center}
.check .box{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent}
.check .box svg.i{width:20px;height:20px;stroke-width:3.2}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff}
.shot-text{flex:1;min-width:0;border:0;background:none;outline:none;padding:11px 0;font-size:16.5px;line-height:1.4;border-radius:8px}
.shot.done .shot-text{color:var(--faint);text-decoration:line-through}
.pl-foot{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-left:-6px}
.pl-text{margin:2px 0 8px;padding:10px 12px;border-radius:13px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.tline b{color:var(--ink);color:color-mix(in srgb,var(--wc,var(--muted)) 78%,var(--ink))}
.tline[data-w="do"]{font-style:italic;color:var(--muted)}
.plan-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}

/* ---------- okna ---------- */
#layer{position:relative;z-index:50}
.scrim{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:var(--scrim)}
.scrim.top{justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 48px) 12px 0}
.scrim.center{justify-content:center;padding:20px}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);padding:8px var(--gr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gl)}
.sheet:focus{outline:none}
.scrim.top .sheet{border-radius:22px;padding-bottom:16px}
.sheet.full{max-width:760px;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.sheet-head{display:flex;align-items:center;gap:8px;min-height:52px}
.sheet-head h2{flex:1;min-width:0;font-size:20px}
.sheet-body{display:flex;flex-direction:column;gap:10px}
.sheet.full .sheet-body{flex:1;min-height:0}
.sheet-text{color:var(--muted)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 12px;border-radius:14px;font-weight:700;font-size:16.5px;text-align:left;background:var(--surface-2)}
.menu-item svg.i{color:var(--muted)}
.menu-item.danger,.menu-item.danger svg.i{color:var(--red)}
.field{width:100%;min-height:54px;padding:0 14px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);font-size:17px;font-weight:500}
.field:focus{outline:none;border-color:var(--blue)}
.area{width:100%;flex:1;min-height:150px;padding:12px 14px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);font-size:16.5px;line-height:1.45}
.area:focus{outline:none;border-color:var(--blue)}
.sheet.full .area{max-height:46%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line-2);font-weight:700;font-size:15px}
.chip.on{background:var(--blue);color:#fff;box-shadow:none}
.working{width:100%;max-width:340px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);padding:24px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.working p{color:var(--muted);min-height:2.9em}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:max-content;max-width:calc(100% - 28px);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:15px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);font-size:14.5px;font-weight:500}
.toast button{flex:none;min-height:36px;padding:0 10px;border-radius:10px;font-weight:700;color:var(--gold)}
:root[data-theme="dark"] .toast button{color:#b3610a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#b3610a}}

/* ---------- čtečka ---------- */
.reader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#05060f;color:#fff;color-scheme:dark}
.r-top,.r-bottom{flex:none;display:flex;align-items:center;gap:8px;padding:8px var(--gr) 8px var(--gl);background:#0d1024}
.r-top{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.r-bottom{justify-content:space-between;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.reader .icon-btn{color:#fff;background:#1c2142}
.reader .seg{flex:1;background:#1c2142}
.reader .seg button{color:#a6aed2;min-height:40px}
.reader .seg button.on{background:#fff;color:#0b1030}
.r-wrap{position:relative;flex:1;min-height:0}
.r-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 var(--gr) 0 calc(var(--gl) + 14px)}
.r-scroll:focus{outline:none}
.r-scroll.mirror{transform:scaleX(-1)}
.r-content{max-width:680px;margin:0 auto;font-family:var(--body);font-weight:500;line-height:1.32;overflow-wrap:anywhere}
.r-marker{position:absolute;left:calc(var(--gl) - 6px);top:34%;width:0;height:0;border:9px solid transparent;border-left-color:var(--gold);pointer-events:none}
.r-scene{margin:1.1em 0 .6em;font-family:var(--display);font-weight:900;font-size:.5em;letter-spacing:.12em;text-transform:uppercase;color:#8d96c2}
.r-line{margin:0 0 .75em;transition:opacity .2s}
.r-who{display:block;font-size:.44em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9d0f0;color:color-mix(in srgb,var(--wc,#a6aed2) 62%,#fff)}
.r-line[data-w="do"]{font-size:.72em;font-style:italic;font-weight:500;color:#ffd978}
.reader[data-me="envin"] .r-line:not([data-w="envin"]):not([data-w="both"]):not([data-w="none"]),
.reader[data-me="neli"] .r-line:not([data-w="neli"]):not([data-w="both"]):not([data-w="none"]){opacity:.3}
.r-end{margin:1.5em 0 0;font-size:.5em;font-weight:700;letter-spacing:.2em;color:#8d96c2;text-align:center}
.r-group{display:flex;align-items:center;gap:6px}
.r-group .icon-btn{font-weight:700;font-size:17px}
.r-speed{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:#a6aed2}
.r-play{flex:none;width:68px;height:68px;border-radius:50%;background:var(--gold);color:#0b1030;display:grid;place-items:center}
.r-play svg.i{width:30px;height:30px;fill:currentColor;stroke-width:1.5}
.r-empty{padding:30% 10px 0;text-align:center;font-size:18px;color:#a6aed2}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.spinner{animation-duration:2.4s}}
@media (min-width:700px){#view{padding-bottom:60px}.vt{font-size:21px}}

.ro .addbox,.ro .btn.dashed,.ro .addline,.ro .plan-actions{display:none}
@media (max-width:359px){.seg .n{display:none}.seg button{font-size:14.5px;padding:0 4px}}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg.fmt{flex:none;width:164px}
.seg.fmt button{min-height:40px;font-size:15.5px}
.seg.fmt button.on[data-f="long"]{background:var(--blue);color:#fff}
.seg.fmt button.on[data-f="short"]{background:#e5252a;color:#fff}
@media (max-width:359px){.brand b{display:none}.seg.fmt{width:140px}}
.thumbwrap{padding:0 4px 10px}
.thumbwrap:empty{display:none}
.addthumb{margin-left:-10px;color:var(--muted)}
.thumb{position:relative;display:block;width:100%;max-width:300px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.loading{display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.thumb.broken::after{content:"Obrázek se nenačetl";position:absolute;inset:0;display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--muted)}
.yt{display:flex;flex-direction:column;gap:10px}
.yt-img{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.yt-img img{display:block;width:100%;height:100%;object-fit:cover}
.yt-img.broken::after{content:"Obrázek se nenačetl";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.yt-title{font-family:var(--display);font-weight:900;font-size:18px;line-height:1.2;overflow-wrap:anywhere}

function applyAi(mode, blocks, units, res) {

async function shrinkImage(file) {
  const OK = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  let src = null, w = 0, hgt = 0, url = '';
  try { src = await createImageBitmap(file); w = src.width; hgt = src.height; } catch { src = null; }

      img.src = url;
      await img.decode();
      src = img; w = img.naturalWidth; hgt = img.naturalHeight;
    } catch { src = null; }
  }
  try {
    if (!src || !w || !hgt) {
      if (OK.includes(file.type) && file.size <= 19 * 1024 * 1024) return file;
      throw { code: 'decode' };
    }
    const k = Math.min(1, 1280 / Math.max(w, hgt));
    if (k === 1 && OK.includes(file.type) && file.size <= 1.5 * 1024 * 1024) return file;
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(hgt * k));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src, 0, 0, cv.width, cv.height);
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86));
    if (out && out.size) return out;
    if (OK.includes(file.type) && file.size <= 19 * 1024 * 1024) return file;
    throw { code: 'decode' };
  } finally {
    if (url) URL.revokeObjectURL(url);
    if (src && src.close) try { src.close(); } catch {}
  }
}

async function setThumb(col, item, onState) {
  if (!assetsApi) { toast('Obrázky může nahrávat jen ten, kdo má aplikaci jako Editor.'); return; }
  const file = await pickImage();

    const blob = await shrinkImage(file);

      if (e && e.code === 'store_unavailable') { await sleep(800 + Math.random() * 800); res = await assetsApi.upload(blob); }
      else throw e;

    if (res.url) thumbUrls.set(res.id, res.url);
    const cur = data[col].get(item.id);
    const old = cur && cur.thumb;
    const ok = await write(`${col}/${item.id}`, 'update', { thumb: res.id, updatedAt: Date.now() });
    if (ok && old && old !== res.id) assetsApi.delete(old).catch(() => {});
    if (ok) toast('Thumbnail je uložený.');
    else assetsApi.delete(res.id).catch(() => {});
  } catch (e) {
    toast(UPLOAD_ERR[e && e.code] || 'Obrázek se nepodařilo nahrát. Zkus to znovu.');
  } finally {
    uploading.delete(item.id); onState();
  }
}

async function generatePlan({ before, pasted }) {
  const S = SC, P = PL;
  if (!S || !S.loaded || busy) return;
  const vid = S.id;
  const blocks = contentBlocks(S.blocks);
  if (!blocks.length) { toast('Scénář je zatím prázdný.'); return; }
  busy = true;
  const biggest = Math.max(...blocks.map(b => b.lines.length));
  /* Scény od autora necháme být. Jeden dlouhý blok (nebo vložený text s obřími částmi) rozdělí AI. */
  const mode = blocks.length >= 2 && (!pasted || biggest <= 14) ? 'keep' : 'split';
  const oldPlan = data.plans.get(vid);
  const prevPlan = oldPlan ? (({ id, ...rest }) => rest)(oldPlan) : null;
  const prevBlocks = before || serialize(S.blocks);
  const ov = workingOverlay('Chystám plán natáčení', 'Čtu scénář. Trvá to asi půl minuty.');
  let out = null, note = '', scriptChanged = !!pasted;
  try {
    const sample = sampleOff ? null : await sampleReady;
    if (ov.stopped) { toast(pasted ? 'Zastaveno. Scénář je vložený, plán zatím ne.' : 'Zastaveno. Nic se nezměnilo.'); return; }
    if (sample) {
      const ctl = new AbortController();
      ov.onStop = () => ctl.abort();
      const { prompt, units } = buildPlanPrompt(mode, data.videos.get(vid), blocks);
      try {
        const res = await sample.json(prompt, {
          signal: ctl.signal, cache: false,
          onText: ({ text }) => { const n = (String(text).match(/"shots"/g) || []).length; if (n) ov.setText(`Plánuju záběry… ${plural(n, 'scéna', 'scény', 'scén')}`); },
        });
        out = applyAi(mode, blocks, units, res);
      } catch (e) {
        const code = e && e.code;
        if (code === 'cancelled') { toast(pasted ? 'Zastaveno. Scénář je vložený, plán zatím ne.' : 'Zastaveno. Nic se nezměnilo.'); return; }
        if (AI_OFF.has(code)) sampleOff = true;
        note = `${AI_ERR[code] || 'Spojení s AI vypadlo.'} Udělal jsem aspoň jednoduchý plán podle scén. Můžeš ho upravit, nebo to zkusit znovu.`;
      }
    } else note = 'AI teď není k dispozici, tak je plán jednoduchý, podle scén. Můžeš si ho upravit.';
    if (!out) out = localPlan(blocks);

    const touch = mode === 'split' ? out.blocks !== blocks : out.fixes.size > 0;
    if (touch) {
      scriptChanged = true;
      if (SC === S && !S.closed) {
        if (mode === 'split') S.blocks = normBlocks(out.blocks);
        else for (const b of S.blocks) for (const l of b.lines) { const f = out.fixes.get(l.id); if (f) { l.type = f[0]; l.who = f[1]; } }
        S.dirty = true;
        saveSession(S);
        rebuildEditor();
      } else {
        await write('scripts/' + vid, 'set', { blocks: serialize(normBlocks(out.blocks)), updatedAt: Date.now() });
      }
    }
    const t = Date.now();
    if (P && !P.closed) { clearTimeout(P.timer); P.timer = 0; P.scenes = null; P.dirty = false; P.packOpen = null; P.openText.clear(); }
    await write('plans/' + vid, 'set', { scenes: out.scenes, done: {}, packed: {}, items: planItems(out.scenes), tip: out.tip || '', ai: !note, createdAt: t, updatedAt: t });
    if (SC === S && R.video === vid) {
      if (R.vtab !== 'plan') go({ vtab: 'plan' }, true); else renderPlan(true);
      $('#view').scrollTop = 0;
    }
    const undo = (prevPlan || scriptChanged) ? {
      action: 'Vrátit', run: async () => {
        if (scriptChanged) {
          if (SC && SC.id === vid && !SC.closed) { SC.blocks = normBlocks(prevBlocks); SC.dirty = true; saveSession(SC); rebuildEditor(); }
          else await write('scripts/' + vid, 'set', { blocks: prevBlocks, updatedAt: Date.now() });
        }
        if (PL && PL.vid === vid) { PL.scenes = null; PL.dirty = false; }
        await write('plans/' + vid, prevPlan ? 'set' : 'delete', prevPlan || undefined);
        if (PL && PL.vid === vid) renderPlan(true);
      },
    } : {};
    toast(note || 'Plán natáčení je hotový.', { ...undo, ms: note ? 7000 : 3200 });
  } finally {
    ov.close();
    busy = false;
  }
}

  }
  let known = !!data.videos.get(id);
  $('#top').replaceChildren(h('div.vhead', iconBtn('back', 'Zpět na videa', () => go({ video: null, tab: 'videa' })), titleIn, iconBtn('more', 'Možnosti videa', menu)), segHost);
  $('#view').replaceChildren(body);
  bannerHost = null;
  paintHead(); showTab();
  storeReady.then(() => {
    if (S.closed) return;
    S.unsub = watchDoc('scripts/' + id, (d, err) => onScriptSnap(S, d, err));
    setTimeout(() => { if (!S.closed && !S.loaded && !S.error) { S.slow = true; if (SC === S) buildEditor(); } }, 10000);
  });
  return {
    video: id,
    setTab() { paintHead(); showTab(); $('#view').scrollTop = 0; },
    update(col) {
      if (col === '*' || col === 'videos') {
        const now = !!data.videos.get(id);
        whenFree(paintHead);
        if (now !== known) { known = now; showTab(); }
        else renderPlan();
      }
      if (col === '*' || col === 'plans') { whenFree(paintHead); renderPlan(); }
    },
    leave() {
      saveTitle.flush();
      S.closed = true; P.closed = true;
      if (S.unsub) S.unsub();
      saveSession(S); savePlan(P);
      if (SC === S) SC = null;
      if (PL === P) PL = null;
      ED = { host: null, list: null, stats: null };
    },
  };
}

/* ================= čtečka ================= */
function openReader({ startBlockId }) {
  const S = SC;
  if (!S) return;
  const blocks = contentBlocks(S.blocks);
  const prefs = { speed: 4, size: innerWidth < 500 ? 30 : 40, mirror: false, ...LS.json(K_READER, {}) };
  prefs.speed = Math.min(9, Math.max(1, Math.round(Number(prefs.speed)) || 4));
  prefs.size = Math.min(64, Math.max(20, Math.round(Number(prefs.size)) || 30));
  let me = LS.get(K_ROLE, '');
  if (me !== 'envin' && me !== 'neli') me = 'all';
  const prevFocus = document.activeElement;
  let playing = false, raf = 0, last = 0, pos = 0, touching = false, lock = null;

  const content = h('div.r-content');
  const scroll = h('div.r-scroll' + (prefs.mirror ? '.mirror' : ''), { tabIndex: 0, 'aria-label': 'Text čtečky' }, content);
  const playBtn = h('button.r-play', { type: 'button' });
  const speedLbl = h('span.r-speed', { title: 'Rychlost' });
  const segHost = h('div', { style: 'flex:1;min-width:0' });
  let startEl = null;
  if (!blocks.length) content.append(h('p.r-empty', 'Scénář je zatím prázdný.'));
  else {
    for (const b of blocks) {
      const t = h('div.r-scene', b.title || '');
      if (b.id === startBlockId) startEl = t;
      content.append(t);
      for (const l of b.lines) {
        const w = whoKey(l);
        content.append(h('div.r-line', { dataset: { w } }, l.type === 'do' || w === 'none' ? null : h('span.r-who', whoLabel(w)), h('span.r-text', l.text.trim())));
      }
    }
    content.append(h('div.r-end', 'KONEC'));
  }
  const el = h('div.reader', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Čtečka' },
    h('div.r-top', iconBtn('x', 'Zavřít čtečku', () => close()), segHost,
      iconBtn('mirror', 'Zrcadlit pro sklo čtecího zařízení', () => { prefs.mirror = !prefs.mirror; scroll.classList.toggle('mirror', prefs.mirror); save(); })),
    h('div.r-wrap', scroll, h('div.r-marker', { 'aria-hidden': 'true' })),
    h('div.r-bottom',
      h('div.r-group', iconBtn('', 'Menší písmo', () => setSize(-4)), iconBtn('', 'Větší písmo', () => setSize(4))),
      playBtn,
      h('div.r-group', iconBtn('', 'Pomaleji', () => setSpeed(-1)), speedLbl, iconBtn('', 'Rychleji', () => setSpeed(1)))));
  const [bSm, bLg] = el.querySelectorAll('.r-bottom .r-group:first-child .icon-btn');
  bSm.textContent = 'A−'; bLg.textContent = 'A+'; bSm.style.fontSize = '14px'; bLg.style.fontSize = '19px';
  const [bSl, bFa] = el.querySelectorAll('.r-bottom .r-group:last-child .icon-btn');
  bSl.textContent = '−'; bFa.textContent = '+'; bSl.style.fontSize = bFa.style.fontSize = '24px';

  const save = () => LS.set(K_READER, JSON.stringify(prefs));
  function paintSeg() {
    el.dataset.me = me;
    segHost.replaceChildren(segEl('Čí řádky zvýraznit', [{ id: 'envin', label: cfg.names.envin }, { id: 'neli', label: cfg.names.neli }, { id: 'all', label: 'Oba' }], me, v => { me = v; LS.set(K_ROLE, v === 'all' ? '' : v); paintSeg(); }));
  }
  function layout() {
    const hgt = scroll.clientHeight || 600;
    content.style.fontSize = prefs.size + 'px';
    content.style.paddingTop = Math.round(hgt * 0.3) + 'px';
    content.style.paddingBottom = Math.round(hgt * 0.62) + 'px';
    speedLbl.textContent = String(prefs.speed);
  }
  function setSize(d) { prefs.size = Math.min(64, Math.max(20, prefs.size + d)); layout(); pos = scroll.scrollTop; save(); }
  function setSpeed(d) { prefs.speed = Math.min(9, Math.max(1, prefs.speed + d)); layout(); save(); }
  const pxPerSec = () => 11 * prefs.size * prefs.size / Math.max(240, content.clientWidth) * (0.4 + 0.15 * prefs.speed);
  function paintPlay() {
    playBtn.replaceChildren(icon(playing ? 'pause' : 'play'));
    playBtn.setAttribute('aria-label', playing ? 'Zastavit' : 'Spustit');
  }
  function frame(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    if (!touching) {
      const max = scroll.scrollHeight - scroll.clientHeight;
      pos += pxPerSec() * dt;
      if (pos >= max) { scroll.scrollTop = max; pause(); return; }
      scroll.scrollTop = pos;
    }
    raf = requestAnimationFrame(frame);
  }
  async function wake(on) {
    try {
      if (on && navigator.wakeLock && !lock) lock = await navigator.wakeLock.request('screen');
      else if (!on && lock) { const l = lock; lock = null; await l.release(); }
    } catch { lock = null; }
  }
  function play() {
    if (playing || !blocks.length) return;
    if (scroll.scrollTop >= scroll.scrollHeight - scroll.clientHeight - 2) scroll.scrollTop = 0;
    pos = scroll.scrollTop; playing = true; last = performance.now();
    raf = requestAnimationFrame(frame);
    paintPlay(); wake(true);
  }
  function pause() { playing = false; cancelAnimationFrame(raf); paintPlay(); wake(false); }
  const toggle = () => playing ? pause() : play();
  playBtn.addEventListener('click', toggle);
  scroll.addEventListener('click', toggle);
  scroll.addEventListener('scroll', () => { if (Math.abs(scroll.scrollTop - pos) > 3) pos = scroll.scrollTop; }, { passive: true });
  scroll.addEventListener('touchstart', () => { touching = true; }, { passive: true });
  const untouch = () => { touching = false; pos = scroll.scrollTop; };
  scroll.addEventListener('touchend', untouch, { passive: true });
  scroll.addEventListener('touchcancel', untouch, { passive: true });
  const onKey = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === ' ' && e.target === scroll) { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowUp' && e.target === scroll) { e.preventDefault(); setSpeed(1); }
    else if (e.key === 'ArrowDown' && e.target === scroll) { e.preventDefault(); setSpeed(-1); }
  };
  const onResize = () => layout();
  function close() {
    pause();
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', onResize);
    el.remove();
    if (prevFocus && prevFocus.isConnected && !isTextField(prevFocus)) { try { prevFocus.focus({ preventScroll: true }); } catch {} }
  }
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('resize', onResize);
  if (isTextField(document.activeElement)) document.activeElement.blur();
  if (toastEl) toastEl.remove();
  $('#layer').append(el);
  paintSeg(); paintPlay(); layout();
  if (startEl) scroll.scrollTop = Math.max(0, startEl.offsetTop - Math.round(scroll.clientHeight * 0.3));
  pos = scroll.scrollTop;
  try { scroll.focus({ preventScroll: true }); } catch {}
}

/* ================= navigace ================= */
function routeToHash() {
  if (R.video) return (R.vtab === 'plan' ? 'nataceni-' : 'video-') + R.video;
  if (R.tab === 'videa') return 'videa';
  return (NOTE_KINDS.find(k => k.id === R.notes) || NOTE_KINDS[0]).hash;
}
function hashToRoute(hs) {
  hs = String(hs || '').replace(/^#/, '');
  if (!hs) return null;
  let m = hs.match(/^(video|nataceni)-([A-Za-z0-9_~.:@+-]{1,80})$/);
  if (m) return { tab: 'videa', video: m[2], vtab: m[1] === 'nataceni' ? 'plan' : 'script' };
  if (hs === 'videa') return { tab: 'videa', video: null };
  if (hs === 'poznamky') return { tab: 'poznamky', video: null };
  const k = NOTE_KINDS.find(x => x.hash === hs);
  return k ? { tab: 'poznamky', notes: k.id, video: null } : null;
}
function renderTabbar() {
  const tb = $('#tabbar');
  tb.hidden = !!R.video;
  const tab = (id, ic, label) => h('button.tab' + (R.tab === id ? '.on' : ''), { type: 'button', 'aria-current': R.tab === id ? 'page' : null, onclick: () => go({ tab: id, video: null }) }, icon(ic), label);
  tb.replaceChildren(tab('poznamky', 'note', 'Poznámky'), tab('videa', 'clapper', 'Videa'));
}
function mount() {
  if (view && view.leave) view.leave();
  view = null;
  afterPointer.clear();
  if (R.video) view = VideoView(R.video);
  else if (R.tab === 'videa') view = VideosView();
  else view = NotesView();
  renderTabbar();
  $('#view').scrollTop = 0;
}
function go(patch, tabOnly) {
  for (const d of [...pendingFlush]) d.flush();
  const sameVideo = tabOnly && view && view.video && view.video === R.video;
  Object.assign(R, patch);
  const hs = routeToHash();
  if ('#' + hs !== location.hash) { try { location.hash = hs; } catch {} }
  LS.set(K_VIEW, hs);
  if ('fmt' in patch) LS.set(K_FMT, R.fmt);
  if (sameVideo && view.setTab) view.setTab(); else mount();
}
window.addEventListener('hashchange', () => {
  const hs = location.hash.slice(1);
  if (hs === routeToHash()) return;
  const r = hashToRoute(hs);
  if (!r) return;
  const same = view && view.video && r.video === view.video;
  Object.assign(R, r);
  LS.set(K_VIEW, routeToHash());
  if (same && view.setTab) view.setTab(); else mount();
});
function flushAll() {
  for (const d of [...pendingFlush]) d.flush();
  if (SC) saveSession(SC);
  if (PL) savePlan(PL);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => sizeAll(document.body), 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => sizeAll(document.body));

function start(hot) {
  R.fmt = LS.get(K_FMT, 'long') === 'short' ? 'short' : 'long';
  const init = hashToRoute(location.hash) || hashToRoute(hot && hot.hs) || hashToRoute(LS.get(K_VIEW, ''));
  if (init) Object.assign(R, init);
  mount();
  initStore();
}
const hotApi = window.claude && window.claude.hot;
try { if (hotApi && hotApi.snapshot) hotApi.snapshot(() => { flushAll(); return { hs: routeToHash() }; }); } catch {}
if (hotApi && hotApi.ready) hotApi.ready(start); else start((hotApi && hotApi.data) || {});
})();
